name: mobile
description: "KoVoit - Application mobile de covoiturage"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP Client avec intercepteurs
  dio: ^5.7.0

  # HTTP standard (streaming SSE pour chatbot)
  http: ^1.2.2

  # Stockage clé-valeur (session chatbot)
  shared_preferences: ^2.3.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^9.2.2

  # Cartes & Géolocalisation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Notifications locales
  flutter_local_notifications: ^18.0.1

  # WebSocket (messagerie temps réel)
  web_socket_channel: ^3.0.1

  # QR Code — génération (passager) + scan (conducteur)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Shimmer loading (skeleton DaisyUI)
  shimmer: ^3.0.0

  # Utilitaires
  intl: ^0.20.1
  url_launcher: ^6.3.1

  # Graphiques (économie)
  fl_chart: ^0.69.0

  # File upload (documents)
  file_picker: ^8.1.4

  # Permissions
  permission_handler: ^11.3.1

  # Guidage vocal navigation
  flutter_tts: ^4.2.1

  # Audio — enregistrement et lecture (messagerie vocale)
  record: ^7.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Découverte mDNS (Bonjour/Zeroconf) — trouve le serveur Django automatiquement
  multicast_dns: ^0.3.2+4

  # Boussole magnétique (heading précis pour AR)
  flutter_compass: ^0.8.0

  # Accéléromètre + gyroscope (orientation AR)
  sensors_plus: ^6.0.1

  # Caméra (flux vidéo pour Réalité Augmentée)
  camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logos/logo1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/logo1.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
