name: mobile
description: "KoVoit - Application mobile de covoiturage"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP Client avec intercepteurs
  dio: ^5.7.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^9.2.2

  # Cartes & Géolocalisation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Notifications locales
  flutter_local_notifications: ^18.0.1

  # WebSocket (messagerie temps réel)
  web_socket_channel: ^3.0.1

  # QR Code
  qr_flutter: ^4.1.0

  # Shimmer loading (skeleton DaisyUI)
  shimmer: ^3.0.0

  # Utilitaires
  intl: ^0.20.1
  url_launcher: ^6.3.1

  # Graphiques (économie)
  fl_chart: ^0.69.0

  # File upload (documents)
  file_picker: ^8.1.4

  # Permissions
  permission_handler: ^11.3.1

  # Guidage vocal navigation
  flutter_tts: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
